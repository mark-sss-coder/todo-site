name: Deploy to GitHub Pages on Release

on:
  release:
    types: [published] # Запуск только при публикации нового релиза

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }} # Исправлена опечатка (было двоеточие)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Точка означает, что файлы index.html, стили и скрипты лежат прямо в корне репозитория.
          # Если они лежат в подпапке (например, src), замените '.' на './src'
          path: '.' 

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
